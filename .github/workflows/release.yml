name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish win-x64 and win-arm64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rids = @("win-x64", "win-arm64")
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null

          foreach ($rid in $rids) {
            $stage = Join-Path $env:RUNNER_TEMP "AdaptiveBarPC-$rid"
            $appOutput = Join-Path $stage "AdaptiveBarPC"
            $studioOutput = Join-Path $stage "AdaptiveBarStudio"
            New-Item -ItemType Directory -Force -Path $appOutput, $studioOutput | Out-Null

            dotnet restore AdaptiveBarPC.sln --runtime $rid
            if ($LASTEXITCODE -ne 0) { throw "Restore failed for $rid" }

            dotnet publish src/AdaptiveBarPC.App/AdaptiveBarPC.App.csproj --configuration Release --runtime $rid --self-contained true --no-restore --output $appOutput
            if ($LASTEXITCODE -ne 0) { throw "AdaptiveBarPC publish failed for $rid" }

            dotnet publish src/AdaptiveBarPC.Designer/AdaptiveBarPC.Designer.csproj --configuration Release --runtime $rid --self-contained true --no-restore --output $studioOutput
            if ($LASTEXITCODE -ne 0) { throw "AdaptiveBar Studio publish failed for $rid" }

            $profilesOutput = Join-Path $appOutput "Profiles"
            New-Item -ItemType Directory -Force -Path $profilesOutput | Out-Null
            Copy-Item -Path "src/AdaptiveBarPC.App/Profiles/*" -Destination $profilesOutput -Recurse -Force

            Copy-Item LICENSE, THIRD-PARTY-NOTICES.md, README.md -Destination $stage -Force
            $archive = Join-Path $artifactDirectory "AdaptiveBarPC-$($env:GITHUB_REF_NAME)-$rid.zip"
            Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $archive -CompressionLevel Optimal -Force
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = Get-ChildItem -Path "artifacts/*.zip" | ForEach-Object { $_.FullName }
          if ($assets.Count -ne 2) { throw "Expected two runtime archives, found $($assets.Count)" }
          gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed" }
