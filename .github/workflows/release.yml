name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore win-x64 dependencies
        run: dotnet restore AdaptiveBarPC.sln --runtime win-x64

      - name: Publish application and designer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $stage = Join-Path $env:RUNNER_TEMP "AdaptiveBarPC-$tag"
          $appOutput = Join-Path $stage 'AdaptiveBarPC'
          $designerOutput = Join-Path $stage 'AdaptiveBarPC-Studio'
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts'

          if (Test-Path $stage) {
            Remove-Item $stage -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $appOutput, $designerOutput, $artifactDirectory | Out-Null

          dotnet publish src/AdaptiveBarPC.App/AdaptiveBarPC.App.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=false --no-restore --output $appOutput
          if ($LASTEXITCODE -ne 0) { throw 'AdaptiveBarPC.App publish failed.' }

          dotnet publish src/AdaptiveBarPC.Designer/AdaptiveBarPC.Designer.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=false --no-restore --output $designerOutput
          if ($LASTEXITCODE -ne 0) { throw 'AdaptiveBarPC.Designer publish failed.' }

          $profilesSource = Join-Path $env:GITHUB_WORKSPACE 'src/AdaptiveBarPC.App/Profiles'
          $profilesOutput = Join-Path $appOutput 'Profiles'
          New-Item -ItemType Directory -Force -Path $profilesOutput | Out-Null
          if (Test-Path $profilesSource) {
            Copy-Item -Path (Join-Path $profilesSource '*') -Destination $profilesOutput -Recurse -Force
          }

          $assetsOutput = Join-Path $appOutput 'Assets'
          $profileFiles = @(Get-ChildItem -Path $profilesOutput -Filter '*.json' -File -Recurse)
          if (-not (Test-Path (Join-Path $appOutput 'AdaptiveBarPC.exe'))) {
            throw 'The published touch bar executable is missing.'
          }
          if (-not (Test-Path (Join-Path $designerOutput 'AdaptiveBarPC.Designer.exe'))) {
            throw 'The published AdaptiveBar Studio executable is missing.'
          }
          if (-not (Test-Path $assetsOutput) -or @(Get-ChildItem -Path $assetsOutput -File -Recurse).Count -eq 0) {
            throw 'The published application assets are missing.'
          }
          if ($profileFiles.Count -eq 0) {
            throw 'No sample profile JSON files were included in the package.'
          }

          Copy-Item -Path @('LICENSE', 'THIRD-PARTY-NOTICES.md', 'README.md') -Destination $stage -Force
          $archive = Join-Path $artifactDirectory "AdaptiveBarPC-$tag-win-x64.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AdaptiveBarPC ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/AdaptiveBarPC-${{ github.ref_name }}-win-x64.zip
          token: ${{ secrets.GITHUB_TOKEN }}
